# actionlint 1.7.12 predates GitHub's `$/` self-repository action reference.
paths:
  .github/workflows/semgrep.yaml:
    ignore:
      - 'specifying action "\$/\.github/actions/semgrep" in invalid format'
  .github/workflows/harbor-image.yaml:
    ignore:
      - 'specifying action "\$/\.github/actions/build-scan" in invalid format'
