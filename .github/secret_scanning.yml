# GitHub secret scanning: skip the Semgrep rule fixtures. tests/semgrep/ holds deliberately fake,
# format-shaped credentials that semgrep-rules/secrets.yaml must catch, and now that this repo is
# public every one of them would otherwise open an alert for an admin to close as "used in tests".
# This file only affects alerts; push protection and partner notifications ignore it.
paths-ignore:
  - "tests/semgrep/**"
