name: Harbor image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without a tag, e.g. harbor.safeinsights.org/openstax/r-base
        type: string
        required: true
      tag:
        description: Tag template; {date} (UTC YYYY-MM-DD), {sha} and {sha8} are substituted, e.g. 4.5.1-{date}-{sha8}
        type: string
        required: true
      context:
        description: Docker build context, relative to the caller's repo root
        type: string
        default: .
      file:
        description: Dockerfile path; empty means <context>/Dockerfile
        type: string
        default: ''
      platforms:
        type: string
        default: linux/amd64
      push:
        description: Set false to never push. Even when true, only main pushes; PRs and other branches only build.
        type: boolean
        default: true
      fail-on-severity:
        description: Fixable image vulnerabilities at these severities fail the job; HIGH and CRITICAL are always reported
        type: string
        default: CRITICAL
      trivyignores:
        description: Path to a .trivyignore(.yaml) in the caller's repo for accepted findings
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 90
    secrets:
      HARBOR_USERNAME:
        required: false
      HARBOR_TOKEN:
        required: false
      COSIGN_PRIVATE_KEY:
        description: cosign private key (PEM); required when pushing
        required: false
      COSIGN_PASSWORD:
        required: false
    outputs:
      image-ref:
        description: The image reference that was built (and pushed, if pushed)
        value: ${{ jobs.build.outputs.image-ref }}
      digest:
        description: The pushed image digest; empty when nothing was pushed
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      image-ref: ${{ steps.ref.outputs.image-ref }}
      digest: ${{ steps.push.outputs.digest }}
    env:
      PUSH: ${{ inputs.push && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image reference
        id: ref
        env:
          IMAGE: ${{ inputs.image }}
          TAG_TEMPLATE: ${{ inputs.tag }}
        run: |
          tag="${TAG_TEMPLATE//\{date\}/$(date -u +%Y-%m-%d)}"
          tag="${tag//\{sha8\}/${GITHUB_SHA::8}}"
          tag="${tag//\{sha\}/${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::'$TAG_TEMPLATE' resolves to '$tag', which is not a valid Docker tag"
            exit 1
          fi
          echo "image-ref=${IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
      # Fails before building, not after an unsigned image has already been pushed.
      - name: Check inputs and secrets
        env:
          PLATFORMS: ${{ inputs.platforms }}
          HAS_HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME != '' }}
          HAS_HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN != '' }}
          HAS_COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
        run: |
          if [[ "$PLATFORMS" == *,* ]]; then
            echo "::error::platforms must be a single platform: the image is loaded into the local daemon so the scanned image is the pushed one"
            exit 1
          fi
          if [ "$PUSH" = true ]; then
            missing=()
            [ "$HAS_HARBOR_USERNAME" = true ] || missing+=(HARBOR_USERNAME)
            [ "$HAS_HARBOR_TOKEN" = true ] || missing+=(HARBOR_TOKEN)
            [ "$HAS_COSIGN_PRIVATE_KEY" = true ] || missing+=(COSIGN_PRIVATE_KEY)
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::Pushing needs these secrets: ${missing[*]}"
              exit 1
            fi
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Before the build, so a FROM on a private Harbor image can pull its base.
      - name: Log in to Harbor
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: harbor.safeinsights.org
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      # Loaded into the local daemon so Trivy scans, and docker push ships, this exact image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          load: true
          tags: ${{ steps.ref.outputs.image-ref }}
      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image-ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy-image.txt
          exit-code: '0'
          trivyignores: ${{ inputs.trivyignores }}
          version: v0.70.0
          cache-dir: ${{ github.workspace }}/.cache/trivy
      - name: Add the report to the summary
        run: |
          {
            echo "### Fixable HIGH/CRITICAL vulnerabilities"
            echo '```'
            cat trivy-image.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on ${{ inputs.fail-on-severity }} vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image-ref }}
          scanners: vuln
          severity: ${{ inputs.fail-on-severity }}
          ignore-unfixed: true
          format: table
          exit-code: '1'
          trivyignores: ${{ inputs.trivyignores }}
          version: v0.70.0
          cache-dir: ${{ github.workspace }}/.cache/trivy
          skip-setup-trivy: true
      - name: Push
        id: push
        if: env.PUSH == 'true'
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image-ref }}
        run: |
          docker push "$IMAGE_REF"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      # Signed with the org key and kept off Sigstore's public transparency log, so these private
      # repos' names and digests are not published. --tlog-upload is deprecated in cosign 3; recheck
      # these flags when bumping cosign-release.
      - name: Sign and verify
        if: env.PUSH == 'true'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGNED_REF: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false "$SIGNED_REF"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
          cosign verify --key "$RUNNER_TEMP/cosign.pub" --insecure-ignore-tlog=true "$SIGNED_REF" > /dev/null
      - name: Summary
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image-ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ "$PUSH" = true ]; then
            echo "Pushed and signed \`$IMAGE_REF\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built and scanned \`$IMAGE_REF\` (not pushed)" >> "$GITHUB_STEP_SUMMARY"
          fi
