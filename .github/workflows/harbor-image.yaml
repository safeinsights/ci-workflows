name: Harbor image

# Two jobs, so that a pull request never runs inside the caller's environment: `build` builds and
# scans with no secret at all, and `push` (main only) builds, scans, pushes and signs inside
# `inputs.environment`, whose deployment branch policy must allow main alone. A PR that edits the
# caller's workflow therefore cannot reach the Harbor or cosign secrets.
on:
  workflow_call:
    inputs:
      image:
        description: Full image name without a tag, e.g. harbor.safeinsights.org/openstax/r-base
        type: string
        required: true
      tag:
        description: Tag template; {date} (UTC YYYY-MM-DD), {sha} and {sha8} are substituted, e.g. 4.5.1-{date}-{sha8}
        type: string
        required: true
      environment:
        description: GitHub environment holding the Harbor and cosign secrets, with a deployment branch policy of main only
        type: string
        required: true
      context:
        description: Docker build context, relative to the caller's repo root
        type: string
        default: .
      file:
        description: Dockerfile path; empty means <context>/Dockerfile
        type: string
        default: ''
      platforms:
        type: string
        default: linux/amd64
      push:
        description: Set false to never push. Even when true, only main pushes; PRs and other branches only build.
        type: boolean
        default: true
      fail-on-severity:
        description: Fixable image vulnerabilities at these severities fail the job; HIGH and CRITICAL are always reported
        type: string
        default: CRITICAL
      trivyignores:
        description: Path to a .trivyignore(.yaml) in the caller's repo for accepted findings
        type: string
        default: ''
      timeout-minutes:
        type: number
        default: 90
    secrets:
      HARBOR_USERNAME:
        required: false
      HARBOR_TOKEN:
        required: false
      COSIGN_PRIVATE_KEY:
        description: cosign private key (PEM); required when pushing
        required: false
      COSIGN_PASSWORD:
        required: false
    outputs:
      image-ref:
        description: The image reference that was built (and pushed, if pushed)
        value: ${{ jobs.push.outputs.image-ref || jobs.build.outputs.image-ref }}
      digest:
        description: The pushed image digest; empty when nothing was pushed
        value: ${{ jobs.push.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    if: ${{ !(inputs.push && github.event_name != 'pull_request' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `$/` resolves to this repo at the caller's pinned commit; it cannot carry an @sha, so the
      # mutable-tag rule misreads it.
      - id: image
        uses: $/.github/actions/build-scan # nosemgrep: github-actions-mutable-action-tag
        with:
          image: ${{ inputs.image }}
          tag: ${{ inputs.tag }}
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          fail-on-severity: ${{ inputs.fail-on-severity }}
          trivyignores: ${{ inputs.trivyignores }}
      - name: Summary
        env:
          IMAGE_REF: ${{ steps.image.outputs.image-ref }}
        run: echo "Built and scanned \`$IMAGE_REF\` (not pushed)" >> "$GITHUB_STEP_SUMMARY"

  push:
    if: ${{ inputs.push && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    environment: ${{ inputs.environment }}
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails before building, not after an unsigned image has already been pushed.
      - name: Check secrets
        env:
          HAS_HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME != '' }}
          HAS_HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN != '' }}
          HAS_COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          missing=()
          [ "$HAS_HARBOR_USERNAME" = true ] || missing+=(HARBOR_USERNAME)
          [ "$HAS_HARBOR_TOKEN" = true ] || missing+=(HARBOR_TOKEN)
          [ "$HAS_COSIGN_PRIVATE_KEY" = true ] || missing+=(COSIGN_PRIVATE_KEY)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Pushing needs these secrets in the '$ENVIRONMENT' environment: ${missing[*]}"
            exit 1
          fi
      # Before the build, so a FROM on a private Harbor image can pull its base.
      - name: Log in to Harbor
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: harbor.safeinsights.org
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - id: image
        uses: $/.github/actions/build-scan # nosemgrep: github-actions-mutable-action-tag
        with:
          image: ${{ inputs.image }}
          tag: ${{ inputs.tag }}
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          fail-on-severity: ${{ inputs.fail-on-severity }}
          trivyignores: ${{ inputs.trivyignores }}
      - name: Push
        id: push
        env:
          IMAGE_REF: ${{ steps.image.outputs.image-ref }}
        run: |
          docker push "$IMAGE_REF"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REF")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      # Signed with the org key and kept off Sigstore's public transparency log, so these private
      # repos' names and digests are not published. --tlog-upload is deprecated in cosign 3; recheck
      # these flags when bumping cosign-release.
      - name: Sign and verify
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          SIGNED_REF: ${{ inputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --use-signing-config=false --tlog-upload=false "$SIGNED_REF"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
          cosign verify --key "$RUNNER_TEMP/cosign.pub" --insecure-ignore-tlog=true "$SIGNED_REF" > /dev/null
      - name: Summary
        env:
          IMAGE_REF: ${{ steps.image.outputs.image-ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Pushed and signed \`$IMAGE_REF\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"
