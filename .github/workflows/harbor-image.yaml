name: Harbor image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without a tag, e.g. harbor.safeinsights.org/openstax/r-base
        type: string
        required: true
      tag:
        description: Tag template; {date} (UTC YYYY-MM-DD), {sha} and {sha8} are substituted, e.g. 4.5.1-{date}-{sha8}
        type: string
        required: true
      context:
        description: Docker build context, relative to the caller's repo root
        type: string
        default: .
      file:
        description: Dockerfile path; empty means <context>/Dockerfile
        type: string
        default: ''
      platforms:
        type: string
        default: linux/amd64
      push:
        description: Set false to never push. Even when true, only main pushes; PRs and other branches only build.
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 90
    secrets:
      HARBOR_USERNAME:
        required: false
      HARBOR_TOKEN:
        required: false
    outputs:
      image-ref:
        description: The image reference that was built (and pushed, if pushed)
        value: ${{ jobs.build.outputs.image-ref }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      image-ref: ${{ steps.ref.outputs.image-ref }}
    env:
      PUSH: ${{ inputs.push && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve image reference
        id: ref
        env:
          IMAGE: ${{ inputs.image }}
          TAG_TEMPLATE: ${{ inputs.tag }}
        run: |
          tag="${TAG_TEMPLATE//\{date\}/$(date -u +%Y-%m-%d)}"
          tag="${tag//\{sha8\}/${GITHUB_SHA::8}}"
          tag="${tag//\{sha\}/${GITHUB_SHA}}"
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::'$TAG_TEMPLATE' resolves to '$tag', which is not a valid Docker tag"
            exit 1
          fi
          echo "image-ref=${IMAGE}:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Harbor
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: harbor.safeinsights.org
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.ref.outputs.image-ref }}
      - name: Summary
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image-ref }}
        run: |
          if [ "$PUSH" = true ]; then verb=Pushed; else verb='Built (not pushed)'; fi
          echo "$verb \`$IMAGE_REF\`" >> "$GITHUB_STEP_SUMMARY"
