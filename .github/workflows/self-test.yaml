name: Self-test
on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  trivy-fs:
    uses: ./.github/workflows/trivy-fs.yaml

  opengrep-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-opengrep
      - name: Test the bundled rules against their fixtures
        run: opengrep scan --test --disable-version-check --config .github/actions/opengrep/rules tests/opengrep

  # tests/ holds deliberately unsafe fixtures.
  opengrep:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/opengrep.yaml
    with:
      exclude: tests

  harbor-image:
    uses: ./.github/workflows/harbor-image.yaml
    with:
      image: harbor.safeinsights.org/ci-workflows/self-test
      tag: test-{date}-{sha8}
      context: tests/fixtures/hello
      push: false
      timeout-minutes: 10
