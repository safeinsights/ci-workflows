name: Self-test
on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  trivy-fs:
    uses: ./.github/workflows/trivy-fs.yaml

  semgrep-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-semgrep
      - name: The runner's python is not shadowed by Semgrep's venv
        run: python3 -c 'import sys; sys.exit(".venv" in sys.prefix)'
      - name: Test the bundled rules against their fixtures
        run: semgrep scan --test --metrics=off --disable-version-check --config .github/actions/semgrep/rules tests/semgrep
      - name: Test the report and gate against findings at every severity
        run: tests/semgrep-report/test.sh

  # tests/ holds deliberately unsafe fixtures.
  semgrep:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/semgrep.yaml
    with:
      exclude: tests

  harbor-image:
    uses: ./.github/workflows/harbor-image.yaml
    with:
      image: harbor.safeinsights.org/ci-workflows/self-test
      tag: test-{date}-{sha8}
      context: tests/fixtures/hello
      # Never pushes, so the environment is never entered; the name only satisfies the input.
      environment: harbor
      push: false
      timeout-minutes: 10

  # With push true on a pull request, `build` must run and `push` must be skipped, and the
  # workflow's image-ref output must fall back to the build job's. Never on main: this repo has no
  # harbor environment or secrets.
  harbor-image-pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/harbor-image.yaml
    with:
      image: harbor.safeinsights.org/ci-workflows/self-test
      tag: pr-{sha8}
      context: tests/fixtures/hello
      environment: harbor
      push: true
      timeout-minutes: 10

  harbor-image-pr-outputs:
    if: github.event_name == 'pull_request'
    needs: harbor-image-pr
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      IMAGE_REF: ${{ needs.harbor-image-pr.outputs.image-ref }}
      DIGEST: ${{ needs.harbor-image-pr.outputs.digest }}
    steps:
      - run: |
          echo "image-ref=$IMAGE_REF digest=$DIGEST"
          [[ "$IMAGE_REF" == harbor.safeinsights.org/ci-workflows/self-test:pr-* ]]
          [ -z "$DIGEST" ]
