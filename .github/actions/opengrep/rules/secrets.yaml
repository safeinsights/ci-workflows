# Credential formats. Regex rules run on every file whatever its language, which matters for R and
# for data files. Each pattern needs a prefix or structure distinctive enough that a random column of
# identifiers in study data does not match it.
rules:
    - id: secret-private-key
      languages: [regex]
      severity: ERROR
      message: Contains a private key. Remove it and replace the key pair.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: -----BEGIN ((RSA|DSA|EC|OPENSSH|PGP|ENCRYPTED) )?PRIVATE KEY( BLOCK)?-----

    - id: secret-aws-access-key-id
      languages: [regex]
      severity: ERROR
      message: Contains an AWS access key id. Remove it and rotate the key.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: \b(AKIA|ASIA|AGPA|AIDA|AROA|ANPA|ANVA|AIPA)[0-9A-Z]{16}\b

    - id: secret-aws-secret-access-key
      languages: [regex]
      severity: ERROR
      message: Contains an AWS secret access key. Remove it and rotate the key.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: (?i)aws.{0,20}secret.{0,20}["'][A-Za-z0-9/+]{40}["']

    - id: secret-github-token
      languages: [regex]
      severity: ERROR
      message: Contains a GitHub token. Remove it and revoke the token.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: \b(gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{60,})\b

    - id: secret-gitlab-token
      languages: [regex]
      severity: ERROR
      message: Contains a GitLab token. Remove it and revoke the token.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: \bglpat-[A-Za-z0-9_-]{20,}\b

    - id: secret-slack
      languages: [regex]
      severity: ERROR
      message: Contains a Slack token or webhook URL. Remove it and revoke it in Slack.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: (\bxox[abposr]-[0-9A-Za-z-]{10,}|https://hooks\.slack\.com/(services|workflows|triggers)/[A-Za-z0-9/_-]{20,})

    - id: secret-stripe-key
      languages: [regex]
      severity: ERROR
      message: Contains a live Stripe secret key. Remove it and roll the key.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: \b[rs]k_live_[0-9A-Za-z]{20,}\b

    - id: secret-google-api-key
      languages: [regex]
      severity: ERROR
      message: Contains a Google API key or OAuth client secret. Remove it and rotate it.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: (\bAIza[0-9A-Za-z_-]{35}\b|\bGOCSPX-[0-9A-Za-z_-]{28}\b)

    - id: secret-ai-api-key
      languages: [regex]
      severity: ERROR
      message: Contains an OpenAI, Anthropic, or Hugging Face API key. Remove it and revoke the key.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: (\bsk-(proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,}|\bsk-ant-[a-z]+\d{2}-[A-Za-z0-9_-]{80,}|\bhf_[A-Za-z0-9]{34,}\b)

    - id: secret-sendgrid-key
      languages: [regex]
      severity: ERROR
      message: Contains a SendGrid API key. Remove it and revoke the key.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: \bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b

    - id: secret-azure-storage-key
      languages: [regex]
      severity: ERROR
      message: Contains an Azure storage account key. Remove it and rotate the key.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: AccountKey=[A-Za-z0-9+/]{86}==

    - id: secret-connection-string-password
      languages: [regex]
      severity: WARNING
      message: Contains a database URL with a password in it. Read the password from the environment instead.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      patterns:
          - pattern-regex: \b(postgres(ql)?|mysql|mariadb|mongodb(\+srv)?|redis|rediss|mssql|sqlserver|amqps?)://[^:/\s"'@]+:[^@\s"']+@
          # Templated or empty passwords are not credentials.
          - pattern-not-regex: ://[^:/\s"'@]+:(\$\{?\w+\}?|\{\w*\}|%s|<[^>]*>|\*+|password|pass|changeme)@

    - id: secret-jwt
      languages: [regex]
      severity: WARNING
      message: Contains a JSON Web Token. It may still be valid; remove it.
      metadata:
          cwe: 'CWE-798: Use of Hard-coded Credentials'
      pattern-regex: \beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}
