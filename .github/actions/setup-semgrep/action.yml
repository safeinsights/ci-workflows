name: Set up Semgrep
description: Installs Semgrep CE from the hash-locked uv.lock next to this file and puts it on PATH.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    # uv.lock pins Semgrep and every transitive dependency with hashes, the uv equivalent of a
    # SHA-pinned action; --locked refuses to run if the lock and pyproject disagree.
    - name: Install Semgrep
      shell: bash
      run: |
        uv sync --locked --project "$GITHUB_ACTION_PATH"
        echo "$GITHUB_ACTION_PATH/.venv/bin" >> "$GITHUB_PATH"
