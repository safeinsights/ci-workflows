name: Set up Semgrep
description: Installs Semgrep CE from the hash-locked uv.lock next to this file and puts it on PATH.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # Unset, setup-uv takes the version from the caller's pyproject.toml or installs the latest.
        # Dependabot does not see this pin; bump it when regenerating uv.lock.
        version: 0.13.6
        # The default globs hash the caller's Python files, not this action's lock.
        cache-dependency-glob: ${{ github.action_path }}/uv.lock
    # uv.lock pins Semgrep and every transitive dependency with hashes, the uv equivalent of a
    # SHA-pinned action; --locked refuses to run if the lock and pyproject disagree.
    - name: Install Semgrep
      shell: bash
      run: |
        uv sync --locked --project "$GITHUB_ACTION_PATH"
        # Only semgrep goes on PATH: the venv's own python and pip must not shadow the runner's
        # for the caller's later steps.
        mkdir -p "$RUNNER_TEMP/semgrep-bin"
        ln -sf "$GITHUB_ACTION_PATH/.venv/bin/semgrep" "$RUNNER_TEMP/semgrep-bin/semgrep"
        echo "$RUNNER_TEMP/semgrep-bin" >> "$GITHUB_PATH"
